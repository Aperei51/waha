name: Android Auto App

on:
  push:
    paths:
      - 'android-auto-app/**'
      - '.github/workflows/android-auto-app.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-auto-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug lintDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: painel-auto-apk
          path: android-auto-app/app/build/outputs/apk/debug/app-debug.apk
